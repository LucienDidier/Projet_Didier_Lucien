<div class="signup-page">
	<section class="signup-panel" aria-labelledby="signup-title">
		<div class="eyebrow"><span class="eyebrow-mark"></span> Créer un compte</div>
		<h1 id="signup-title">Inscription</h1>
		<p class="intro">Créez votre compte pour rejoindre la plateforme.</p>

		<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
			<label class="field">
				<span>Nom</span>
				<input
					id="name"
					type="text"
					formControlName="name"
					autocomplete="name"
					maxlength="80"
				/>
				<app-error-field [control]="form.controls.name" [messages]="errorMessages.name" />
			</label>

			<label class="field">
				<span>Adresse e-mail</span>
				<input
					id="email"
					type="email"
					formControlName="email"
					autocomplete="email"
					maxlength="254"
				/>
				<app-error-field [control]="form.controls.email" [messages]="errorMessages.email" />
			</label>

			<label class="field">
				<span>Mot de passe</span>
				<input
					id="password"
					type="password"
					formControlName="password"
					autocomplete="new-password"
					maxlength="128"
				/>
				<app-error-field [control]="form.controls.password" [messages]="errorMessages.password" />
			</label>

			<button type="submit" [disabled]="isSubmitting">
				{{ isSubmitting ? 'Inscription en cours…' : 'Créer mon compte' }}
			</button>
		</form>

		@if (successMessage) {
			<p class="feedback success" role="status">{{ successMessage }}</p>
		}
		@if (errorMessage) {
			<p class="feedback error" role="alert">{{ errorMessage }}</p>
		}
	</section>
</div>
